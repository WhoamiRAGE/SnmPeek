# snmpeek config
# Copy this file to config.yaml and edit it to match your network.

network:
  subnet: "192.168.1.0/24"       # subnet to ARP scan
  interface: null                 # null = auto-detect (scapy default route)

snmp:
  enabled: true
  version: "2c"                   # "2c" or "3"
  community: "public"             # used when version is "2c"; often needs to be changed on home routers
  port: 161
  timeout: 1                      # seconds
  retries: 1
  v3:                              # only used when version is "3"
    username: ""
    auth_protocol: "sha"          # none, md5, sha
    auth_key: ""
    priv_protocol: "aes128"       # none, des, aes128
    priv_key: ""

monitor:
  poll_interval: 30               # seconds - how often to re-scan

storage:
  db_path: "snmpeek.db"

ui:
  refresh_rate: 2                 # seconds - TUI refresh rate
